<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Reflector } from 'three/addons/objects/Reflector.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// ============================================================
//  雨夜便利店街角 · 三渲二微缩景观
//  布局（俯视，单位≈米，底座 22×22，中心为原点）：
//    前方道路 z∈[5.5,10.2]，右侧道路 x∈[5.5,10.2]，两路在右前角相交
//    近侧人行道呈 L 形包住地块；便利店 x∈[-6,0.5] z∈[-7,-1]，门朝 +z
//    左侧公寓与便利店之间是小巷 x∈[-8,-6]；右侧为停车位
// ============================================================

const JP = '"Yu Gothic UI","Yu Gothic","Meiryo","Hiragino Sans","Noto Sans JP","Microsoft YaHei",sans-serif';
const FX = 1;                       // 特效图层：雨、光锥、积水反射，不参与描边
const PR = Math.min(devicePixelRatio, 2);
// 页面在隐藏标签或 0 尺寸容器里加载时 innerWidth 可能为 0，统一兜底
const VW = () => Math.max(innerWidth, 1), VH = () => Math.max(innerHeight, 1);

// ---------- 渲染器 / 场景 / 相机 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(PR);
renderer.setSize(VW(), VH());
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // 场景静态，阴影只算一次
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x1b1a3a, 0.0065);

const camera = new THREE.PerspectiveCamera(30, innerWidth > 0 && innerHeight > 0 ? innerWidth / innerHeight : 16 / 9, 1, 180);
camera.layers.enable(FX);
{
  const dist = 54 * Math.min(1.8, Math.max(1, 1.25 / camera.aspect));
  camera.position.copy(new THREE.Vector3(1.0, 0.82, 1.18).normalize().multiplyScalar(dist));
}
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.3, 1.0, -0.6);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 13;
controls.maxDistance = 80;
controls.minPolarAngle = 0.12;
controls.maxPolarAngle = Math.PI * 0.485;
controls.screenSpacePanning = true;
controls.rotateSpeed = 0.7;
controls.addEventListener('change', () => {
  const t = controls.target;
  t.x = THREE.MathUtils.clamp(t.x, -9, 9);
  t.z = THREE.MathUtils.clamp(t.z, -9, 9);
  t.y = THREE.MathUtils.clamp(t.y, -1, 6);
});

// ---------- 小工具 ----------
let _s = 20261105;
const rand = () => { _s = (_s + 0x6D2B79F5) | 0; let t = Math.imul(_s ^ (_s >>> 15), 1 | _s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
const rr = (a, b) => a + (b - a) * rand();
const pick = (a) => a[Math.floor(rand() * a.length)];
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const PI = Math.PI;

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
function rep(tex, x, y) {
  const t = tex.clone(); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(x, y); t.needsUpdate = true; return t;
}
function txt(g, s, x, y, size, color, weight = 800, align = 'center') {
  g.font = `${weight} ${size}px ${JP}`; g.fillStyle = color; g.textAlign = align; g.textBaseline = 'middle'; g.fillText(s, x, y);
}
function rrect(g, x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }

// 三渲二色阶：4 段硬阴影
const gradMap = new THREE.DataTexture(new Uint8Array([95, 160, 220, 255]), 4, 1, THREE.RedFormat);
gradMap.minFilter = gradMap.magFilter = THREE.NearestFilter; gradMap.needsUpdate = true;

const _tc = new Map();
const T = (c) => { if (!_tc.has(c)) _tc.set(c, new THREE.MeshToonMaterial({ color: c, gradientMap: gradMap })); return _tc.get(c); };
const TM = (p) => new THREE.MeshToonMaterial({ gradientMap: gradMap, ...p });
const G = (c, k = 1, p = {}) => new THREE.MeshBasicMaterial({ color: new THREE.Color(c).multiplyScalar(k), fog: false, ...p });
const GM = (map, k = 1, p = {}) => new THREE.MeshBasicMaterial({ map, color: new THREE.Color(k, k, k), fog: false, ...p });

function put(m, parent = scene, cast = true) { m.castShadow = cast; m.receiveShadow = true; parent.add(m); return m; }
// 注意：y 参数均为“底部高度”
function box(w, h, d, mat, x = 0, y = 0, z = 0, parent = scene, cast = true) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y + h / 2, z); return put(m, parent, cast);
}
function rbox(w, h, d, r, mat, x = 0, y = 0, z = 0, parent = scene, cast = true) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, r), mat); m.position.set(x, y + h / 2, z); return put(m, parent, cast);
}
function cyl(rt, rb, h, mat, x = 0, y = 0, z = 0, parent = scene, seg = 16, cast = true) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), mat); m.position.set(x, y + h / 2, z); return put(m, parent, cast);
}
function rod(a, b, r, mat, parent = scene, seg = 8) {
  const d = new THREE.Vector3().subVectors(b, a); const len = d.length();
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), mat);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize());
  return put(m, parent);
}
function tube(pts, r, mat, parent = scene, seg = 40, radial = 6) {
  const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), seg, r, radial, false), mat);
  return put(m, parent);
}
// 竖直平面：默认朝 +z，ry 旋转（PI/2 朝 +x，-PI/2 朝 -x，PI 朝 -z）；y 为中心
function plane(w, h, mat, x, y, z, ry = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.rotation.y = ry; parent.add(m); return m;
}
// 水平贴花：宽沿 x、深沿 z；rz 绕法线旋转（文字“上方”默认朝 -z）
function flat(w, d, mat, x, y, z, rz = 0, parent = scene) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat); m.rotation.set(-PI / 2, 0, rz); m.position.set(x, y, z);
  m.receiveShadow = true; parent.add(m); return m;
}
function fxLayer(o) { o.traverse((c) => c.layers.set(FX)); return o; }

// 柔光光晕贴图（灯头、窗光用）
const haloTex = canvasTex(128, 128, (g, w) => {
  const gr = g.createRadialGradient(w / 2, w / 2, 0, w / 2, w / 2, w / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.25, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, w);
});
function halo(color, size, x, y, z, k = 1) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloTex, color: new THREE.Color(color).multiplyScalar(k), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, fog: false }));
  s.position.set(x, y, z); s.scale.set(size, size, 1); s.renderOrder = 5; scene.add(fxLayer(s)); return s;
}

// 背景：深靛紫渐层
scene.background = canvasTex(1024, 1024, (g, w, h) => {
  const gr = g.createRadialGradient(w * 0.5, h * 0.4, 30, w * 0.5, h * 0.55, w * 0.78);
  gr.addColorStop(0, '#3b3a72'); gr.addColorStop(0.5, '#22224a'); gr.addColorStop(1, '#0b0b1e');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
});

// ============================================================
//  Part 2 · 底座、路面、人行道、积水反射、路面标线
// ============================================================
const SW = 0.15;          // 人行道 / 地块高度
const HB = 11;            // 底座半宽

// 底座（深色胡桃木 + 黄铜铭牌）
rbox(23.0, 1.25, 23.0, 0.12, T(0x3a2a2c), 0, -1.25, 0);
rbox(23.6, 0.32, 23.6, 0.1, T(0x251b22), 0, -1.55, 0);
box(22.2, 0.06, 22.2, T(0x2b2230), 0, -0.06, 0);
{
  const plateTex = canvasTex(1024, 160, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#e9cf92'); gr.addColorStop(0.5, '#c79f58'); gr.addColorStop(1, '#a37b3c');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#7b5a28'; g.lineWidth = 6; g.strokeRect(10, 10, w - 20, h - 20);
    txt(g, '雨夜の街角  ·  ほしぞら町三丁目', w / 2, 64, 54, '#4b3416', 700);
    txt(g, 'RAINY NIGHT CORNER   1 : 50', w / 2, 120, 30, '#5d4320', 600);
  });
  const p = box(4.2, 0.62, 0.05, T(0xc79f58), 0, -0.95, 11.52);
  plane(4.1, 0.6, new THREE.MeshToonMaterial({ map: plateTex, gradientMap: gradMap }), 0, -0.64, 11.55);
  [-1.95, 1.95].forEach((x) => cyl(0.04, 0.04, 0.02, T(0x8a6a32), x, -0.66, 11.55).rotation.x = PI / 2);
}

// ---------- 积水反射 Shader（带雨滴涟漪） ----------
const PuddleShader = {
  name: 'Puddle',
  uniforms: { color: { value: null }, tDiffuse: { value: null }, textureMatrix: { value: null }, time: { value: 0 } },
  vertexShader: /* glsl */`
    uniform mat4 textureMatrix; varying vec4 vUv; varying vec2 vW;
    void main(){ vUv = textureMatrix * vec4(position,1.0); vW = (modelMatrix*vec4(position,1.0)).xz;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: /* glsl */`
    uniform vec3 color; uniform sampler2D tDiffuse; uniform float time; varying vec4 vUv; varying vec2 vW;
    float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    vec3 ripples(vec2 p){
      vec3 acc = vec3(0.);
      for(int i=0;i<3;i++){
        float fi = float(i);
        vec2 q = p*2.3 + fi*17.3;
        vec2 c = floor(q); vec2 f = fract(q);
        vec2 o = vec2(h21(c+fi), h21(c+fi+9.1))*0.6 + 0.2;
        vec2 dv = f - o; float r = length(dv);
        float ph = fract(time*(0.75+0.3*fi) + h21(c*1.7+fi));
        float ring = exp(-pow((r - ph*0.42)*36.0, 2.0)) * (1.0-ph);
        acc.xy += dv/(r+1e-3)*ring; acc.z += ring;
      }
      return acc;
    }
    void main(){
      vec3 rp = ripples(vW);
      vec2 wob = vec2(sin(vW.y*3.1+time*0.8), cos(vW.x*2.7+time*0.6))*0.0025;
      vec4 uv = vUv; uv.xy += (rp.xy*0.035 + wob)*uv.w;
      vec3 refl = texture2DProj(tDiffuse, uv).rgb;
      vec3 col = color*0.05 + refl*color + rp.z*vec3(0.06,0.07,0.11);
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
};
const reflRes = () => [Math.round(VW() * PR * 0.55), Math.round(VH() * PR * 0.55)];
const reflectors = [];
function makeReflector(w, d, x, y, z) {
  const [rw, rh] = reflRes();
  const r = new Reflector(new THREE.PlaneGeometry(w, d), { shader: PuddleShader, color: 0x8f97c4, textureWidth: rw, textureHeight: rh, clipBias: 0.003, multisample: 0 });
  r.rotation.x = -PI / 2; r.position.set(x, y, z); scene.add(r); reflectors.push(r); return r;
}

// 画布坐标映射：x→右，z→下
function mapper(x0, z0, size, px) { const k = px / size; return { k, X: (x) => (x - x0) * k, Z: (z) => (z - z0) * k }; }
function puddles(g, M, list) {
  g.fillStyle = '#000'; const s0 = _s;
  for (const [x, z, rx, rz, a = 0] of list) {
    _s = 7919 + Math.round(x * 131 + z * 977);   // 每个水洼的形状固定，两张贴图可对齐
    g.save(); g.translate(M.X(x), M.Z(z)); g.rotate(a);
    for (let i = 0; i < 6; i++) {
      g.beginPath();
      g.ellipse(rr(-0.35, 0.35) * rx * M.k, rr(-0.35, 0.35) * rz * M.k, rx * M.k * rr(0.45, 0.8), rz * M.k * rr(0.45, 0.8), rr(-0.4, 0.4), 0, PI * 2);
      g.fill();
    }
    g.restore();
  }
  _s = s0;
}
function speckle(g, w, h, n, cols, s0 = 1, s1 = 3) {
  for (let i = 0; i < n; i++) { g.fillStyle = pick(cols); const s = rr(s0, s1); g.fillRect(rr(0, w), rr(0, h), s, s); }
}

// ---------- 车道（整张底座大小，非车道部分被人行道盖住） ----------
const RD = { f0: 5.6, f1: 10.4, r0: 5.6, r1: 10.4 };   // 前路 z∈[f0,f1]，右路 x∈[r0,r1]
const roadPx = 2048, RM = mapper(-HB, -HB, 22, roadPx);
const roadPuddles = [
  [1.0, 7.0, 1.7, 0.75, 0.1], [-4.0, 6.5, 1.3, 0.5], [-8.6, 8.9, 1.1, 0.6], [7.7, 7.6, 1.4, 1.1, 0.5],
  [7.0, -2.0, 0.6, 1.5], [8.8, -7.6, 0.7, 1.2], [3.6, 9.4, 1.0, 0.45], [9.3, 3.0, 0.5, 0.9], [-1.6, 9.7, 0.9, 0.35],
  [6.2, 5.0, 0.5, 0.5], [6.1, -8.6, 0.4, 1.0], [-6.5, 6.0, 0.9, 0.3],
];
function paintMarkings(g, M, col) {
  g.fillStyle = col;
  const R = (x0, z0, x1, z1) => g.fillRect(M.X(x0), M.Z(z0), (x1 - x0) * M.k, (z1 - z0) * M.k);
  // 斑马线（前路，x∈[2.4,4.4]）
  for (let z = 6.15; z < 10.0; z += 0.9) R(2.4, z, 4.4, z + 0.45);
  // 斑马线（右路，z∈[2.4,4.4]）
  for (let x = 6.15; x < 10.0; x += 0.9) R(x, 2.4, x + 0.45, 4.4);
  // 停止线
  R(1.75, 8.05, 1.95, 10.1);  R(5.9, 1.75, 8.0, 1.95);
  // 中心虚线
  for (let x = -10.8; x < 1.4; x += 1.6) R(x, 7.94, x + 0.9, 8.06);
  for (let z = -10.8; z < 1.4; z += 1.6) R(7.94, z, 8.06, z + 0.9);
  // 外侧线
  R(-11, 6.12, 1.7, 6.2); R(-11, 9.82, 2.2, 9.9); R(6.12, -11, 6.2, 1.7); R(9.82, -11, 9.9, 2.2);
  R(4.8, 9.82, 11, 9.9); R(9.82, 4.8, 9.9, 11); R(4.8, 6.12, 5.6, 6.2); R(6.12, 4.8, 6.2, 5.6);
  // 路面文字
  g.save(); g.translate(M.X(0.2), M.Z(9.05)); g.scale(1, 1.6);
  txt(g, '止まれ', 0, 0, 0.62 * M.k, col, 900); g.restore();
  g.save(); g.translate(M.X(9.05), M.Z(0.2)); g.rotate(-PI / 2); g.scale(1, 1.6);
  txt(g, 'スクールゾーン', 0, 0, 0.42 * M.k, col, 900); g.restore();
  // 菱形“前方有人行横道”标志
  g.save(); g.translate(M.X(-3.2), M.Z(9.0)); g.scale(1, 1.8); g.rotate(PI / 4);
  g.lineWidth = 0.09 * M.k; g.strokeStyle = col; g.strokeRect(-0.32 * M.k, -0.32 * M.k, 0.64 * M.k, 0.64 * M.k); g.restore();
}
const roadColor = canvasTex(roadPx, roadPx, (g, w, h) => {
  g.fillStyle = '#2b2c40'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 26000, ['#25263a', '#33344b', '#3a3a52', '#202034']);
  // 湿润的深色斑块
  for (let i = 0; i < 70; i++) { g.fillStyle = 'rgba(16,16,32,0.18)'; g.beginPath(); g.ellipse(rr(0, w), rr(0, h), rr(30, 160), rr(20, 80), rr(0, 3), 0, PI * 2); g.fill(); }
  // 修补痕迹
  g.fillStyle = 'rgba(70,70,92,0.35)'; g.fillRect(RM.X(-7), RM.Z(6.6), 1.6 * RM.k, 1.1 * RM.k); g.fillRect(RM.X(8.4), RM.Z(-5), 1.2 * RM.k, 2.1 * RM.k);
  // 排水沟（混凝土 + 格栅）
  const gut = (x0, z0, x1, z1, alongX) => {
    g.fillStyle = '#6a6a7e'; g.fillRect(RM.X(x0), RM.Z(z0), (x1 - x0) * RM.k, (z1 - z0) * RM.k);
    g.fillStyle = '#5a5a6e'; g.fillRect(RM.X(x0), RM.Z(z0), (x1 - x0) * RM.k, 3);
    const L = alongX ? x1 - x0 : z1 - z0;
    for (let s = 0.8; s < L - 0.5; s += 2.4) {
      const gx = alongX ? x0 + s : x0 + 0.04, gz = alongX ? z0 + 0.04 : z0 + s;
      const gw = alongX ? 0.9 : (x1 - x0) - 0.08, gd = alongX ? (z1 - z0) - 0.08 : 0.9;
      g.fillStyle = '#1b1b28'; g.fillRect(RM.X(gx), RM.Z(gz), gw * RM.k, gd * RM.k);
      g.strokeStyle = '#4b4b60'; g.lineWidth = 3;
      for (let t = 0.07; t < (alongX ? gw : gd); t += 0.09) {
        g.beginPath();
        if (alongX) { g.moveTo(RM.X(gx + t), RM.Z(gz)); g.lineTo(RM.X(gx + t), RM.Z(gz + gd)); }
        else { g.moveTo(RM.X(gx), RM.Z(gz + t)); g.lineTo(RM.X(gx + gw), RM.Z(gz + t)); }
        g.stroke();
      }
    }
  };
  gut(-11, 5.6, 5.6, 5.95, true); gut(5.6, -11, 5.95, 5.6, false); gut(-11, 10.05, 10.4, 10.4, true); gut(10.05, -11, 10.4, 10.05, false);
  // 井盖
  [[-1.5, 7.2], [8.5, -3.5]].forEach(([x, z]) => {
    g.fillStyle = '#3d3d55'; g.beginPath(); g.arc(RM.X(x), RM.Z(z), 0.42 * RM.k, 0, PI * 2); g.fill();
    g.strokeStyle = '#55557a'; g.lineWidth = 4;
    for (let r = 0.12; r < 0.42; r += 0.1) { g.beginPath(); g.arc(RM.X(x), RM.Z(z), r * RM.k, 0, PI * 2); g.stroke(); }
  });
  paintMarkings(g, RM, '#d6d8e8');
});
const roadEmit = canvasTex(roadPx, roadPx, (g, w, h) => { g.fillStyle = '#000'; g.fillRect(0, 0, w, h); paintMarkings(g, RM, '#ffffff'); });

// ---------- 地块 + 人行道（L 形，带积水挖孔） ----------
const LX0 = -HB, LX1 = 5.6, LZ0 = -HB, LZ1 = 5.6, LS = LX1 - LX0;
{
  const hidden = new THREE.MeshBasicMaterial({ visible: false }), side = T(0x6d6a7e);
  const m = new THREE.Mesh(new THREE.BoxGeometry(LS, SW, LS), [side, side, hidden, side, side, side]);
  m.position.set((LX0 + LX1) / 2, SW / 2, (LZ0 + LZ1) / 2); m.receiveShadow = true; scene.add(m);
}
const lotPx = 2048, LM = mapper(LX0, LZ0, LS, lotPx);

  const roof = box(1.75, 0.06, 0.34, T(0x4a5070), 0, 1.96, 0.02, bg); roof.rotation.x = 0.15;
  const boardTex = canvasTex(512, 320, (g, w, h) => {
    g.fillStyle = '#c4a77e'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 400; i++) { g.fillStyle = 'rgba(120,90,60,0.15)'; g.fillRect(rr(0, w), rr(0, h), rr(2, 30), 2); }
    g.fillStyle = '#2b3a2a'; g.fillRect(0, 0, w, 40); txt(g, '町内会 掲示板', w / 2, 21, 26, '#f6eed8', 800);
    const notes = [
      ['夏祭り', '8/24 星空公園', '#fff1c1', '#d24a3a'], ['ゴミ出し', '月・木 燃える', '#e8f6ff', '#2a5ca8'],
      ['迷い猫', '黒猫 さがしています', '#ffe0e6', '#b13a5a'], ['防犯', '夜道に注意', '#e9ffe2', '#2f7a3a'], ['雨の日', '傘の忘れ物', '#fff', '#555'],
    ];
    const pos = [[20, 54, 170, 120, -0.04], [200, 60, 140, 110, 0.05], [356, 52, 136, 150, -0.03], [30, 186, 150, 118, 0.03], [196, 184, 150, 120, -0.05]];
    notes.forEach(([t, s, bgc, fc], i) => {
      const [x, y, ww, hh, a] = pos[i]; g.save(); g.translate(x + ww / 2, y + hh / 2); g.rotate(a);
      g.fillStyle = bgc; g.fillRect(-ww / 2, -hh / 2, ww, hh);
      txt(g, t, 0, -hh * 0.18, 28, fc, 900); g.font = `700 16px ${JP}`; txt(g, s, 0, hh * 0.2, 16, '#444', 700);
      g.fillStyle = '#e2443a'; g.beginPath(); g.arc(0, -hh / 2 + 8, 6, 0, PI * 2); g.fill(); g.restore();
    });
  });
  box(1.5, 0.95, 0.05, wood, 0, 0.9, 0, bg);
  plane(1.42, 0.88, TM({ map: boardTex }), 0, 1.375, 0.03, 0, bg);
  // 公告栏上的小灯
  const bl = cyl(0.05, 0.07, 0.06, G(0xfff0c8, 2.2), 0, 1.84, 0.12, bg, 10, false);
}

// 后方：便利店后的砌块围墙 + 小树 + 后巷电表箱
{
  const blockTex = canvasTex(256, 128, (g, w, h) => { g.fillStyle = '#8f8c9e'; g.fillRect(0, 0, w, h); g.strokeStyle = '#77748a'; g.lineWidth = 4; for (let y = 0; y <= h; y += 32) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); for (let x = (y / 32) % 2 ? 0 : 32; x <= w; x += 64) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 32); g.stroke(); } } });
  const bM = TM({ map: rep(blockTex, 6, 1) });
  box(13.0, 1.2, 0.18, bM, -1.5, SY, -10.8);
  box(0.18, 1.2, 6.0, TM({ map: rep(blockTex, 3, 1) }), 4.0, SY, -7.8);
  // 树
  const tree = (x, z, s) => {
    cyl(0.07 * s, 0.1 * s, 1.4 * s, T(0x5b4038), x, SY, z, scene, 8);
    [[0, 1.6, 0, 0.75], [0.35, 1.4, 0.2, 0.55], [-0.3, 1.45, -0.2, 0.55], [0.05, 2.0, -0.1, 0.5]].forEach(([dx, dy, dz, r]) => {
      const f = new THREE.Mesh(new THREE.IcosahedronGeometry(r * s, 1), T(0x3f7a68)); f.position.set(x + dx * s, SY + dy * s, z + dz * s); put(f, scene);
    });
  };
  tree(2.6, -9.6, 1.1); tree(-10.0, 3.0, 0.75);
  // 电表箱
  box(0.4, 0.5, 0.15, T(0xd8dbe4), 0.6, SY + 1.3, S.z0 - 0.08);
  plane(0.2, 0.14, G(0x8aff9a, 0.6), 0.6, SY + 1.62, S.z0 - 0.16, PI);
  // 屋顶的竖向小灯牌（转角处，竖排）
  const vTex = canvasTex(128, 512, (g, w, h) => { g.fillStyle = C.coral; rrect(g, 0, 0, w, h, 16); g.fill(); g.fillStyle = C.cream; rrect(g, 10, 10, w - 20, h - 20, 10); g.fill(); ['コ', 'ン', 'ビ', 'ニ'].forEach((c, i) => txt(g, c, w / 2, 70 + i * 120, 84, C.coral, 900)); });
  const vg = new THREE.Group(); vg.position.set(S.x1 + 0.02, SY + S.h + 0.15, S.z1 + 0.02); vg.rotation.y = PI / 4; scene.add(vg);
  box(0.5, 1.8, 0.12, trimM, 0, 0, 0, vg);
  plane(0.46, 1.76, GM(vTex, 2.0), 0, 0.9, 0.065, 0, vg);
  plane(0.46, 1.76, GM(vTex, 2.0), 0, 0.9, -0.065, PI, vg);
  cyl(0.05, 0.05, 0.25, poleDk, 0, -0.25, 0, vg, 8);
  halo(0xff9a8a, 3.0, S.x1 + 0.3, SY + S.h + 1.1, S.z1 + 0.3, 0.3);
}

// 招牌的彩色补光（青色 + 珊瑚色），给周围铺上霓虹色调
const signL1 = new THREE.PointLight(0x58fff0, 14, 7, 1.5); signL1.position.set(-2.2, SY + 3.0, 0.0); scene.add(signL1);
const signL2 = new THREE.PointLight(0xff7a9a, 10, 6, 1.5); signL2.position.set(1.8, SY + 3.4, -1.0); scene.add(signL2);
const alleyL = new THREE.PointLight(0xff86c8, 7, 5, 1.6); alleyL.position.set(-6.8, SY + 3.0, 3.6); scene.add(alleyL);
// ============================================================
//  Part 6 · 灯光、雨、溅水、描边、泛光、渲染循环
// ============================================================
const RAIN = 2;
camera.layers.enable(RAIN);

// 环境光：靛蓝夜空 + 冷月光
scene.add(new THREE.HemisphereLight(0x7a7ccc, 0x2a2440, 1.15));
const moon = new THREE.DirectionalLight(0xa9b4ff, 0.75);
moon.position.set(-14, 22, 10); moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048); moon.shadow.bias = -0.0006; moon.shadow.normalBias = 0.02;
Object.assign(moon.shadow.camera, { left: -16, right: 16, top: 16, bottom: -16, near: 1, far: 60 });
scene.add(moon);

// 玻璃不参与描边（透过玻璃也能看到店内轮廓）；积水反射面放进特效层
scene.traverse((o) => { if (o.isMesh && o.material === glassM) o.layers.set(FX); });
reflectors.forEach((r) => { r.layers.set(FX); r.camera.layers.enable(FX); });

// ---------- 雨丝 ----------
const ROOFS = [
  { x0: S.x0 - 0.05, x1: S.x1 + 0.05, z0: S.z0 - 0.05, z1: S.z1 + 0.05, y: SY + S.h + 0.12 },
  { x0: -11.1, x1: -7.8, z0: -11.0, z1: 1.6, y: SY + 6.18 },
  { x0: -3.0, x1: -0.6, z0: S.z1, z1: S.z1 + 1.15, y: SY + 2.5 },          // 雨棚
];
const floorAt = (x, z) => {
  for (const r of ROOFS) if (x > r.x0 && x < r.x1 && z > r.z0 && z < r.z1) return r.y;
  return (x < LX1 && z < LZ1) ? SW : 0.02;
};
const RAIN_TOP = 9.5, WIND = V(0.09, 0, 0.05);
function makeRain(n, len, speed, alpha, layer = RAIN) {
  const pos = new Float32Array(n * 6), seed = new Float32Array(n * 6), endA = new Float32Array(n * 2);
  for (let i = 0; i < n; i++) {
    const x = rr(-HB, HB), z = rr(-HB, HB), f = floorAt(x, z), ph = rand(), sp = rr(0.85, 1.15);
    for (let k = 0; k < 2; k++) {
      pos.set([x, f, z], (i * 2 + k) * 3);
      seed.set([ph, sp, f], (i * 2 + k) * 3);
      endA[i * 2 + k] = k;
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('seed', new THREE.BufferAttribute(seed, 3));
  geo.setAttribute('endA', new THREE.BufferAttribute(endA, 1));
  const mat = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, len: { value: len }, speed: { value: speed }, alpha: { value: alpha }, wind: { value: WIND }, top: { value: RAIN_TOP } },
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute vec3 seed; attribute float endA; uniform float time, len, speed, top; uniform vec3 wind; varying float vA; varying float vH;
      void main(){
        float range = top - seed.z;
        float h = mod(seed.x * range - time * speed * seed.y, range);
        vec3 p = position; p.y = seed.z + h + endA * len;
        p.xz += wind.xz * (h + endA * len);
        vA = endA; vH = h;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`,
    fragmentShader: /* glsl */`
      uniform float alpha; varying float vA; varying float vH;
      void main(){ float f = smoothstep(0.0, 0.6, vH) * (0.25 + 0.75 * vA); gl_FragColor = vec4(vec3(0.62, 0.72, 1.0) * alpha * f, 1.0); }`,
  });
  const ls = new THREE.LineSegments(geo, mat); ls.frustumCulled = false; ls.layers.set(layer); scene.add(ls);
  return mat;
}
const rainMats = [makeRain(4200, 0.45, 12, 0.1), makeRain(1300, 0.7, 16, 0.17)];

// ---------- 地面溅水（小水花环） ----------
const splashMat = (() => {
  const n = 1600, pos = new Float32Array(n * 3), ph = new Float32Array(n);
  for (let i = 0; i < n; i++) { const x = rr(-HB + 0.1, HB - 0.1), z = rr(-HB + 0.1, HB - 0.1); pos.set([x, floorAt(x, z) + 0.03, z], i * 3); ph[i] = rand(); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('ph', new THREE.BufferAttribute(ph, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, scale: { value: VH() * PR * 0.5 } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute float ph; uniform float time, scale; varying float vT;
      void main(){ vT = fract(time * 1.6 + ph * 7.0); vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = (0.08 + vT * 0.32) * scale / -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: /* glsl */`
      varying float vT;
      void main(){ vec2 c = gl_PointCoord * 2.0 - 1.0; c.y *= 2.4; float r = length(c);
        float ring = smoothstep(0.12, 0.0, abs(r - 0.75)) * (1.0 - vT);
        if (ring < 0.01) discard; gl_FragColor = vec4(vec3(0.7, 0.8, 1.0) * ring * 0.45, 1.0); }`,
  });
  const p = new THREE.Points(geo, m); p.frustumCulled = false; p.layers.set(RAIN); scene.add(p);
  return m;
})();

// 雨棚边缘的滴水
const dripMat = (() => {
  const n = 40, pos = new Float32Array(n * 3), ph = new Float32Array(n);
  for (let i = 0; i < n; i++) { pos.set([-2.95 + (i / (n - 1)) * 2.3 + rr(-0.03, 0.03), 0, S.z1 + 1.18], i * 3); ph[i] = rand(); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3)); geo.setAttribute('ph', new THREE.BufferAttribute(ph, 1));
  const m = new THREE.ShaderMaterial({
    uniforms: { time: { value: 0 }, scale: { value: VH() * PR * 0.5 }, y0: { value: SY + 2.27 }, y1: { value: SW } }, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      attribute float ph; uniform float time, scale, y0, y1; varying float vA;
      void main(){ float t = fract(time * 0.9 + ph); float fall = max(0.0, t - 0.35) / 0.65; vec3 p = position;
        p.y = mix(y0, y1, fall * fall); vA = t < 0.35 ? t / 0.35 : 1.0;
        vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_PointSize = 0.07 * scale / -mv.z; gl_Position = projectionMatrix * mv; }`,
    fragmentShader: /* glsl */`
      varying float vA; void main(){ vec2 c = gl_PointCoord * 2.0 - 1.0; c.x *= 1.6; float d = 1.0 - dot(c, c); if (d < 0.0) discard;
        gl_FragColor = vec4(vec3(0.8, 0.9, 1.0) * d * vA, 1.0); }`,
  });
  const p = new THREE.Points(geo, m); p.frustumCulled = false; p.layers.set(RAIN); scene.add(p);
  return m;
})();

// ---------- 后期：描边 + 泛光 ----------
const normalMat = new THREE.MeshNormalMaterial();
const makeNormalTarget = () => {
  const t = new THREE.WebGLRenderTarget(VW() * PR, VH() * PR, { type: THREE.HalfFloatType });
  t.depthTexture = new THREE.DepthTexture(VW() * PR, VH() * PR); t.depthTexture.type = THREE.UnsignedIntType;
  return t;
};
let normalTarget = makeNormalTarget();

const OutlineShader = {
  uniforms: {
    tDiffuse: { value: null }, tNormal: { value: null }, tDepth: { value: null },
    texel: { value: new THREE.Vector2(1 / VW(), 1 / VH()) }, near: { value: camera.near }, far: { value: camera.far },
    lineColor: { value: new THREE.Color(0x14122a) }, thick: { value: 1.0 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: /* glsl */`
    #include <packing>
    uniform sampler2D tDiffuse, tNormal, tDepth; uniform vec2 texel; uniform float near, far, thick; uniform vec3 lineColor; varying vec2 vUv;
    float D(vec2 uv){ return -perspectiveDepthToViewZ(texture2D(tDepth, uv).x, near, far); }
    vec3 N(vec2 uv){ return texture2D(tNormal, uv).xyz * 2.0 - 1.0; }
    void main(){
      vec4 col = texture2D(tDiffuse, vUv);
      vec2 o = texel * thick;
      float d0 = D(vUv); vec3 n0 = N(vUv);
      vec2 offs[4]; offs[0] = vec2(o.x, 0.); offs[1] = vec2(-o.x, 0.); offs[2] = vec2(0., o.y); offs[3] = vec2(0., -o.y);
      float de = 0., ne = 0.;
      for (int i = 0; i < 4; i++) {
        float d = D(vUv + offs[i]); vec3 n = N(vUv + offs[i]);
        de += abs(d - d0); ne += 1.0 - dot(n0, n);
      }
      float dEdge = smoothstep(0.035, 0.08, de / d0);
      float nEdge = smoothstep(0.35, 0.8, ne);
      float e = max(dEdge, nEdge);
      float fade = 1.0 - smoothstep(60.0, 110.0, d0);
      gl_FragColor = vec4(mix(col.rgb, lineColor, e * 0.88 * fade), col.a);
    }`,
};

const composer = new EffectComposer(renderer);
composer.setPixelRatio(PR); composer.setSize(VW(), VH());
composer.addPass(new RenderPass(scene, camera));
const outlinePass = new ShaderPass(OutlineShader);
composer.addPass(outlinePass);
const bloom = new UnrealBloomPass(new THREE.Vector2(VW(), VH()), 0.42, 0.5, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function syncOutlineUniforms() {
  const u = outlinePass.uniforms;
  u.tNormal.value = normalTarget.texture; u.tDepth.value = normalTarget.depthTexture;
  u.texel.value.set(1 / (VW() * PR), 1 / (VH() * PR));
  u.thick.value = PR >= 1.5 ? 1.6 : 1.0;
}
syncOutlineUniforms();

function renderNormals() {
  const bg = scene.background, fog = scene.fog;
  scene.background = null; scene.fog = null; scene.overrideMaterial = normalMat;
  camera.layers.set(0);
  renderer.setRenderTarget(normalTarget); renderer.setClearColor(0x7f7fff, 1); renderer.clear(); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.setClearColor(0x000000, 1);
  camera.layers.enable(FX); camera.layers.enable(RAIN);
  scene.background = bg; scene.fog = fog; scene.overrideMaterial = null;
}

// ---------- 窗口变化 ----------
let lastW = VW(), lastH = VH();
function onResize() {
  lastW = VW(); lastH = VH();
  camera.aspect = VW() / VH(); camera.updateProjectionMatrix();
  renderer.setSize(VW(), VH()); composer.setSize(VW(), VH()); bloom.setSize(VW(), VH());
  normalTarget.dispose(); normalTarget = makeNormalTarget(); syncOutlineUniforms();
  const [rw, rh] = reflRes(); reflectors.forEach((r) => r.getRenderTarget().setSize(rw, rh));
  splashMat.uniforms.scale.value = dripMat.uniforms.scale.value = VH() * PR * 0.5;
}
addEventListener('resize', onResize);

// ---------- 动画循环 ----------
const clock = new THREE.Clock();
let shadowFrames = 3;
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  if (VW() !== lastW || VH() !== lastH) onResize();
  controls.update();
  rainMats.forEach((m) => (m.uniforms.time.value = t));
  splashMat.uniforms.time.value = t; dripMat.uniforms.time.value = t;
  reflectors.forEach((r) => (r.material.uniforms.time.value = t));
  // 小巷灯牌偶尔闪烁一下
  const flick = (Math.sin(t * 23.0) > 0.96 && Math.sin(t * 0.7) > 0.6) ? 0.25 : 1.0;
  alleyL.intensity = 7 * flick;
  if (shadowFrames > 0) { renderer.shadowMap.needsUpdate = true; shadowFrames--; }
  renderNormals();
  composer.render();
});
</script>
</body>
