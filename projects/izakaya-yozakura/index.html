<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>夜桜と居酒屋 · Three.js</title>
<style>
  :root { --ink:#f3e9e4; --dim:#b9aab0; --sakura:#f29ab2; --red:#d8394e; --gold:#d9b26f; --glass:rgba(16,13,28,.62); }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#05060f; color:var(--ink);
    font-family:"Noto Sans SC","Microsoft YaHei","PingFang SC",system-ui,sans-serif; }
  #app canvas { display:block; touch-action:none; }
  .serif { font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif CJK JP","Noto Serif SC","SimSun",serif; }
  #title { position:fixed; top:22px; left:26px; pointer-events:none; user-select:none;
    text-shadow:0 2px 14px rgba(0,0,0,.8); }
  #title .jp { font-size:34px; letter-spacing:.18em; font-weight:600; }
  #title .jp b { color:var(--sakura); font-weight:600; }
  #title .sub { margin-top:6px; font-size:13px; letter-spacing:.3em; color:var(--dim); }
  #panel { position:fixed; left:18px; bottom:18px; width:270px; padding:14px 16px 12px;
    background:var(--glass); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(242,154,178,.22); border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.45);
    font-size:13px; transition:transform .35s ease, opacity .35s ease; }
  #panel.hide { transform:translateY(calc(100% - 38px)); }
  #panel h3 { margin:0 0 10px; font-size:13px; font-weight:600; letter-spacing:.2em; color:var(--gold);
    display:flex; justify-content:space-between; align-items:center; cursor:pointer; user-select:none; }
  #panel h3 span.arrow { font-size:11px; color:var(--dim); transition:transform .3s; }
  #panel.hide h3 span.arrow { transform:rotate(180deg); }
  .row { display:flex; align-items:center; gap:10px; margin:8px 0; }
  .row label { width:56px; color:var(--dim); flex:none; }
  .row output { width:34px; text-align:right; font-variant-numeric:tabular-nums; color:var(--ink); flex:none; }
  input[type=range] { flex:1; accent-color:var(--sakura); height:18px; }
  .btns { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:10px; }
  .btns.views { grid-template-columns:repeat(4,1fr); }
  .sep { margin:12px 0 2px; font-size:11px; letter-spacing:.25em; color:var(--dim); }
  button { font:inherit; font-size:12.5px; color:var(--ink); background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:7px 4px; cursor:pointer;
    transition:background .2s, border-color .2s, color .2s; }
  button:hover { background:rgba(242,154,178,.16); border-color:rgba(242,154,178,.5); }
  button.on { background:rgba(216,57,78,.32); border-color:rgba(242,120,140,.7); color:#fff; }
  #hint { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); padding:8px 16px;
    font-size:12px; letter-spacing:.08em; color:var(--dim); background:rgba(10,8,20,.45);
    border-radius:999px; pointer-events:none; white-space:nowrap; transition:opacity 1s; }
  #tip { position:fixed; pointer-events:none; padding:5px 10px; font-size:12px; border-radius:6px;
    background:rgba(20,10,20,.85); border:1px solid rgba(242,154,178,.45); color:#fff;
    transform:translate(14px,14px); opacity:0; transition:opacity .15s; white-space:nowrap; }
  #toast { position:fixed; top:26px; left:50%; transform:translate(-50%,-20px); opacity:0;
    padding:10px 20px; border-radius:10px; font-size:14px; letter-spacing:.06em;
    background:rgba(24,12,22,.82); border:1px solid rgba(217,178,111,.5); color:#fbeee0;
    transition:all .35s ease; pointer-events:none; }
  #toast.show { opacity:1; transform:translate(-50%,0); }
  @media (max-width:720px) {
    #title .jp { font-size:24px; } #title .sub { font-size:11px; letter-spacing:.15em; }
    #panel { width:calc(100% - 24px); left:12px; bottom:12px; }
    #hint { display:none; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div id="title" class="serif">
  <div class="jp">夜<b>桜</b>と居酒屋</div>
  <div class="sub">春の夜 · 樱花飘落的小酒馆</div>
</div>
<div id="panel">
  <h3 id="panelHead"><span>操 作</span><span class="arrow">▼</span></h3>
  <div class="row"><label>风力</label><input id="wind" type="range" min="0" max="1.5" step="0.05" value="0.6"><output id="windV">0.6</output></div>
  <div class="row"><label>花瓣数量</label><input id="petals" type="range" min="200" max="5000" step="100" value="2200"><output id="petalsV">2200</output></div>
  <div class="btns">
    <button id="bShake">摇一摇樱花树</button>
    <button id="bDoor">拉开店门</button>
    <button id="bLamp" class="on">灯笼：亮</button>
    <button id="bRotate">自动环绕</button>
    <button id="bSound">环境音：关</button>
    <button id="bClear">清扫落花</button>
  </div>
  <div class="sep">视 角</div>
  <div class="btns views">
    <button data-view="front">正面</button>
    <button data-view="tree">树下</button>
    <button data-view="inside">店内</button>
    <button data-view="far">远景</button>
  </div>
</div>
<div id="hint">拖动旋转 · 右键/双指平移 · 滚轮缩放 · 点击灯笼、店门、暖帘、樱花树、风铃、自动贩卖机</div>
<div id="tip"></div>
<div id="toast"></div>
